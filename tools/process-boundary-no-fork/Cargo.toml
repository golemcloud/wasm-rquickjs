[package]
name = "process-boundary-no-fork"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3

[features]
p2 = ["dep:wstd", "dep:wit-bindgen"]
p3 = ["dep:wasip3", "dep:wit-bindgen-p3"]

[dependencies]
rquickjs = { version = "=0.10.0", default-features = false, features = ["std", "futures", "bindgen", "macro"] }
futures = "0.3"
futures-timer = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wstd = { version = "=0.6.5", optional = true }
wit-bindgen = { version = "0.42.1", default-features = false, features = ["macros"], optional = true }
wasip3 = { version = "=0.7.0", optional = true }
wit-bindgen-p3 = { package = "wit-bindgen", version = "0.58.0", default-features = false, features = ["async", "async-spawn", "macros", "inter-task-wakeup"], optional = true }

# Intentionally no patches, git dependencies, or local dependency overrides.
