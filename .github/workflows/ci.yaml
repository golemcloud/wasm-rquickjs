name: CI

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:

permissions:
  checks: write
  pull-requests: write
  contents: write

env:
  CARGO_TERM_COLOR: always
  WASI_SDK_VERSION: "25"
  WASI_SDK_PATH: /opt/wasi-sdk
  # CI always builds and tests against Golem's wasmtime fork — see
  # .github/scripts/enable-wasmtime-fork.sh for the rationale. Build/test
  # jobs run that script (which uncomments the [patch.crates-io] block in
  # Cargo.toml) and pass --features use-golem-wasmtime via this variable.
  # The `release-binaries` and `publish` jobs deliberately skip both so
  # they keep using the unpatched, crates.io-publishable wasmtime.
  CI_WASMTIME_FORK_FEATURES: --features use-golem-wasmtime

jobs:
  build:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - name: Enable Golem wasmtime fork
        run: bash .github/scripts/enable-wasmtime-fork.sh
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy $CI_WASMTIME_FORK_FEATURES -- -Dwarnings
      - name: Build
        run: cargo build --all-targets $CI_WASMTIME_FORK_FEATURES

  test-other:
    needs: [build]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - name: Enable Golem wasmtime fork
        run: bash .github/scripts/enable-wasmtime-fork.sh
      - name: Compilation, DTS and error tests
        run: cargo test --test compilation --test dts --test errors $CI_WASMTIME_FORK_FEATURES -- --report-time --format ctrf --logfile target/ctrf.json
      - name: Node compatibility parser contracts
        run: cargo test --test js_subtest_parser $CI_WASMTIME_FORK_FEATURES -- --report-time
      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        if: always()
        with:
          report-path: "**/target/ctrf-*.json"
          upload-artifact: "true"
          artifact-name: test-other-report
          summary: true
          summary-report: true
          failed-report: true
          slowest-report: true
          github-report: true
          flaky-report: true
          collapse-large-reports: true
          exit-on-no-files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-runtime:
    needs: [build]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - name: Enable Golem wasmtime fork
        run: bash .github/scripts/enable-wasmtime-fork.sh
      - uses: actions/setup-node@v4
        if: matrix.group == 9
        with:
          node-version: "22.14.0"
      - name: Runtime tests (group ${{ matrix.group }}/9)
        run: cargo test --test runtime $CI_WASMTIME_FORK_FEATURES -- --report-time --format ctrf --logfile target/ctrf.json ':tag:group${{ matrix.group }}'
        env:
          NODE_MODULES_APP_STRICT_NODE_BASELINE: "1"
      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        if: always()
        with:
          report-path: "**/target/ctrf-*.json"
          upload-artifact: "true"
          artifact-name: test-runtime-group-${{ matrix.group }}-report
          summary: true
          summary-report: true
          failed-report: true
          slowest-report: true
          github-report: true
          flaky-report: true
          collapse-large-reports: true
          exit-on-no-files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-node-compat:
    needs: [build]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - name: Enable Golem wasmtime fork
        run: bash .github/scripts/enable-wasmtime-fork.sh
      - name: Vendor Node.js test suite
        run: bash tests/node_compat/vendor.sh
      - name: Module inventory contracts
        if: matrix.shard == 0
        run: cargo test --test node_compat_report $CI_WASMTIME_FORK_FEATURES -- module_related_node_compat_entries_are_configured module_related_known_gaps_are_deferred_or_covered --report-time
      - name: Node compat tests (shard ${{ matrix.shard }}/8)
        run: cargo test --test node_compat $CI_WASMTIME_FORK_FEATURES -- --report-time --format ctrf --logfile target/ctrf.json ':tag:shard${{ matrix.shard }}'
      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        if: always()
        with:
          report-path: "**/target/ctrf-*.json"
          upload-artifact: "true"
          artifact-name: test-node-compat-shard-${{ matrix.shard }}-report
          summary: true
          summary-report: true
          failed-report: true
          slowest-report: true
          github-report: true
          flaky-report: true
          collapse-large-reports: true
          exit-on-no-files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-p3:
    needs: [build]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
      # The WASI Preview 3 path does not use the Preview 2 `wasi:io/poll` pollable
      # behavior that the Golem wasmtime fork patches, so these tests run against
      # the stock crates.io wasmtime (no `enable-wasmtime-fork.sh`, no
      # `use-golem-wasmtime`). This also proves P3 works on unforked wasmtime.
      - name: Install wasmtime CLI
        # `p3_generation` shells out to the `wasmtime` CLI to run generated P3
        # components. Pin it to the workspace wasmtime version (46.x) used by the
        # embedded-host P3 tests so both paths agree on the Component Model async ABI.
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: WASI Preview 3 tests
        # These are ordinary libtest tests (default harness), so they do not take
        # the test-r `--format ctrf` reporter flags used by the other jobs.
        run: cargo test --test p3_generation --test p3_exported_resource --test p3_async_values

  # The full runtime suite, run against the WASI Preview 3 generation path (async component
  # exports, Component Model async host) instead of Preview 2. Runs *every* runtime test — there is
  # no P3 allow-/deny-list — so P3 gaps and regressions show up directly in CI. Expected to have
  # failures until the remaining P3 gaps are closed; it therefore does not gate releases.
  test-runtime-p3:
    needs: [build]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    env:
      # Selects the Preview 3 generation target in the test harness (tests/common/mod.rs).
      WASM_RQUICKJS_TEST_TARGET: p3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        if: matrix.group == 9
        with:
          node-version: "22.14.0"
      # Preview 3 runs on the stock crates.io wasmtime: the Golem wasmtime fork is Preview 2 only,
      # and the P3 host support in tests/common/mod.rs is gated to non-fork builds. So this lane
      # deliberately does NOT run enable-wasmtime-fork.sh or pass --features use-golem-wasmtime.
      - name: Runtime tests on WASI Preview 3 (group ${{ matrix.group }}/9)
        run: cargo test --test runtime -- --report-time --format ctrf --logfile target/ctrf.json ':tag:group${{ matrix.group }}'
        env:
          NODE_MODULES_APP_STRICT_NODE_BASELINE: "1"
      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        if: always()
        with:
          report-path: "**/target/ctrf-*.json"
          upload-artifact: "true"
          artifact-name: test-runtime-p3-group-${{ matrix.group }}-report
          summary: true
          summary-report: true
          failed-report: true
          slowest-report: true
          github-report: true
          flaky-report: true
          collapse-large-reports: true
          # A P3 generation gap can abort the whole test binary before any ctrf file is written;
          # do not turn that into an extra reporter error on top of the failing test step.
          exit-on-no-files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The full node_compat suite, run against the WASI Preview 3 generation path. Runs *every*
  # node_compat test the Preview 2 lane runs (same shard tags, same config.jsonc allow-list of
  # runnable Node.js tests) — there is no additional P3 filter. Expected to have failures until the
  # remaining P3 gaps are closed; it therefore does not gate releases.
  test-node-compat-p3:
    needs: [build]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      WASM_RQUICKJS_TEST_TARGET: p3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
      # Stock crates.io wasmtime — see the note in `test-runtime-p3`.
      - name: Vendor Node.js test suite
        run: bash tests/node_compat/vendor.sh
      - name: Node compat tests on WASI Preview 3 (shard ${{ matrix.shard }}/8)
        run: cargo test --test node_compat -- --report-time --format ctrf --logfile target/ctrf.json ':tag:shard${{ matrix.shard }}'
      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        if: always()
        with:
          report-path: "**/target/ctrf-*.json"
          upload-artifact: "true"
          artifact-name: test-node-compat-p3-shard-${{ matrix.shard }}-report
          summary: true
          summary-report: true
          failed-report: true
          slowest-report: true
          github-report: true
          flaky-report: true
          collapse-large-reports: true
          exit-on-no-files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-binaries:
    needs: [test-other, test-runtime, test-node-compat, test-p3]
    if: "startsWith(github.ref, 'refs/tags/v')"
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-16vcpu-ubuntu-2404
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: blacksmith-16vcpu-ubuntu-2404
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: useblacksmith/rust-cache@v3
        with:
          prefix-key: v1-rust
          shared-key: release-${{ matrix.target }}
          cache-all-crates: true
      - id: get_version
        uses: battila7/get-version-action@v2
      - name: Set version
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version-without-v }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/0.0.0/$VERSION/g" Cargo.toml
          else
            sed -i "s/0.0.0/$VERSION/g" Cargo.toml
          fi
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE="wasm-rquickjs-cli-v${{ steps.get_version.outputs.version-without-v }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C target/${{ matrix.target }}/release wasm-rquickjs
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          ARCHIVE="wasm-rquickjs-cli-v${{ steps.get_version.outputs.version-without-v }}-${{ matrix.target }}.zip"
          cd target/${{ matrix.target }}/release
          7z a "../../../$ARCHIVE" wasm-rquickjs.exe
          cd ../../..
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}

  publish:
    needs: [test-other, test-runtime, test-node-compat, test-p3]
    if: "startsWith(github.ref, 'refs/tags/v')"
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - id: get_version
        uses: battila7/get-version-action@v2
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          export VERSION="${{ steps.get_version.outputs.version-without-v }}"
          sed -i "s/0.0.0/$VERSION/g" Cargo.toml
          cargo publish -p wasm-rquickjs --features optimize --allow-dirty
          cargo publish -p wasm-rquickjs-cli --allow-dirty
