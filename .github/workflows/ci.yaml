name: CI

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  checks: write
  pull-requests: write
  contents: write

env:
  CARGO_TERM_COLOR: always
  WASI_SDK_VERSION: "25"
  WASI_SDK_PATH: /opt/wasi-sdk
  # Cache compilation only. Every case still creates a fresh Store, instance,
  # WASI context, QuickJS runtime, and temporary filesystem.
  WASM_RQUICKJS_TEST_WASMTIME_CACHE: "1"
  WASM_RQUICKJS_TEST_PREPARED_COMPONENT_CACHE: "1"
  WASM_RQUICKJS_TEST_PRECOMPILE_COMPONENT: "1"
  # CI always builds and tests against Golem's wasmtime fork — see
  # .github/scripts/enable-wasmtime-fork.sh for the rationale. Build/test
  # jobs run that script (which uncomments the [patch.crates-io] block in
  # Cargo.toml) and pass --features use-golem-wasmtime via this variable.
  # The `release-binaries` and `publish` jobs deliberately skip both so
  # they keep using the unpatched, crates.io-publishable wasmtime.
  CI_WASMTIME_FORK_FEATURES: --features use-golem-wasmtime

jobs:
  quick-checks:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: CI reporting contracts
        run: node --test .github/scripts/test_prepare_test_reports.cjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  skeleton-clippy:
    needs: [quick-checks]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: skeleton
      - name: Clippy embedded skeleton
        run: tools/check-skeleton-clippy.sh

  build:
    needs: [quick-checks]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: p2
          wasmtime-fork: "true"
      - name: Install component license audit tool
        # rust-cache can restore install metadata without the executable.
        run: cargo binstall --force --locked --version 0.9.2 cargo-about
      - name: Check generated component licenses
        run: tools/check-component-licenses.sh --check
      - name: Clippy
        run: cargo clippy $CI_WASMTIME_FORK_FEATURES -- -Dwarnings
      - name: Build
        run: cargo build --all-targets $CI_WASMTIME_FORK_FEATURES
      - name: Local test profile contracts
        run: cargo test --test dev_test_profiles $CI_WASMTIME_FORK_FEATURES
      - name: Node compatibility parser contracts
        run: cargo test --test js_subtest_parser $CI_WASMTIME_FORK_FEATURES -- --report-time
      - name: Module loader architecture contracts
        run: cargo test -p wasm-rquickjs --lib $CI_WASMTIME_FORK_FEATURES -- module_loader_architecture

  test-other:
    needs: [quick-checks]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # Full history makes push and pull-request diff bases available to
          # the current-report selector. Measured SHAs are optional: retained
          # input hashes remain authoritative after rebases and squash merges.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-key: p2
          wasmtime-fork: "true"
      - name: Test performance-report currentness selection
        run: tools/performance-report-currentness.sh self-test
      - name: Select agentic TypeScript currentness inputs
        id: agentic-ts-currentness
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/select-agentic-ts-currentness.sh "$GITHUB_EVENT_NAME" "$PUSH_BEFORE" "$PR_HEAD" >> "$GITHUB_OUTPUT"
      # Validation mode always checks the manifest-designated reports against their
      # recorded source hint and input hashes. For changed current reports, the
      # shared helper also recomputes those hashes from the measured source when
      # that commit is available locally; it never substitutes the checkout for it.
      - name: Validate agentic TypeScript reports
        shell: bash
        env:
          PERFORMANCE_REPORTS_TO_CHECK: ${{ steps.agentic-ts-currentness.outputs.reports-to-check }}
        run: |
          tools/performance-report-currentness.sh check agentic-ts -- \
            cargo test --test agentic_ts $CI_WASMTIME_FORK_FEATURES
      - name: Validate npm release reports
        shell: bash
        env:
          PERFORMANCE_REPORTS_TO_CHECK: ${{ steps.agentic-ts-currentness.outputs.npm-reports-to-check }}
        run: |
          tools/performance-report-currentness.sh check npm-metadata -- \
            cargo test --test npm_metadata $CI_WASMTIME_FORK_FEATURES
      - name: Compilation, DTS and error tests
        run: cargo test --test compilation --test dts --test errors $CI_WASMTIME_FORK_FEATURES -- --report-time --format ctrf --logfile target/ctrf.json
      - name: Optimizer copy budget contracts (Golem fork)
        run: cargo test --test optimize $CI_WASMTIME_FORK_FEATURES
      - name: Collect Test Report
        uses: ./.github/actions/collect-test-report
        if: always()
        with:
          name: test-other

  test-runtime:
    needs: [quick-checks]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8, 9]
        include:
          - group: 9
            node_version: "22.14.0"
            test_args: "--test-threads 4"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: p2
          wasmtime-fork: "true"
          component-cache-key: p2-runtime-${{ matrix.group }}
      - uses: actions/setup-node@v4
        if: matrix.node_version
        with:
          node-version: ${{ matrix.node_version }}
      - name: Runtime tests (group ${{ matrix.group }}/9)
        run: cargo test --test runtime $CI_WASMTIME_FORK_FEATURES -- ${{ matrix.test_args }} --report-time --format ctrf --logfile target/ctrf.json ':tag:group${{ matrix.group }}'
        env:
          NODE_MODULES_APP_STRICT_NODE_BASELINE: "1"
      - name: Collect Test Report
        uses: ./.github/actions/collect-test-report
        if: always()
        with:
          name: test-runtime-group-${{ matrix.group }}

  test-node-compat:
    needs: [quick-checks]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: p2
          wasmtime-fork: "true"
          component-cache-key: p2-node-${{ matrix.shard }}
      - name: Vendor Node.js test suite
        run: bash tests/node_compat/vendor.sh
      - name: Module inventory contracts
        if: matrix.shard == 0
        run: cargo test --test node_compat_report $CI_WASMTIME_FORK_FEATURES -- ':tag:report_contract' --report-time
      - name: Node compat tests (shard ${{ matrix.shard }}/8)
        run: cargo test --test node_compat $CI_WASMTIME_FORK_FEATURES -- --report-time --format ctrf --logfile target/ctrf.json ':tag:shard${{ matrix.shard }}'
      - name: Collect Test Report
        uses: ./.github/actions/collect-test-report
        if: always()
        with:
          name: test-node-compat-shard-${{ matrix.shard }}

  test-p3:
    needs: [quick-checks]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        suite: [generation, async-values]
        include:
          - suite: generation
            test_args: --test p3_generation --test p3_exported_resource --test optimize
          - suite: async-values
            # Each case creates its own Tokio runtime and compiles a Wasmtime
            # component inside the timeout. Bound competing compiler/runtime pools.
            test_args: --test p3_async_values -- --test-threads 4
    env:
      WASM_RQUICKJS_TEST_ARTIFACT_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: p3
          component-cache-key: p3-${{ matrix.suite }}-shared
      # The WASI Preview 3 path does not use the Preview 2 `wasi:io/poll` pollable
      # behavior that the Golem wasmtime fork patches, so these tests run against
      # the stock crates.io wasmtime (no `enable-wasmtime-fork.sh`, no
      # `use-golem-wasmtime`). This also proves P3 works on unforked wasmtime.
      - name: Install wasmtime CLI
        if: matrix.suite == 'generation'
        # `p3_generation` shells out to the `wasmtime` CLI to run generated P3
        # components. Pin it to the workspace wasmtime version (50.x) used by the
        # embedded-host P3 tests so both paths agree on the Component Model async ABI.
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash -s -- --version v50.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: WASI Preview 3 tests
        # These are ordinary libtest tests (default harness), so they do not take
        # the test-r `--format ctrf` reporter flags used by the other jobs.
        run: /usr/bin/time -v cargo test ${{ matrix.test_args }}

  # The full runtime suite, run against the WASI Preview 3 generation path (async component
  # exports, Component Model async host) instead of Preview 2. Runs *every* runtime test — there is
  # no P3 allow-/deny-list — so P3 gaps and regressions show up directly in CI. Expected to have
  # failures until the remaining P3 gaps are closed; it therefore does not gate releases.
  test-runtime-p3:
    needs: [quick-checks]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8, 9]
        include:
          - group: 9
            node_version: "22.14.0"
            test_args: "--test-threads 4"
    env:
      # Selects the Preview 3 generation target in the test harness (tests/common/mod.rs).
      WASM_RQUICKJS_TEST_TARGET: p3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: p3
          component-cache-key: p3-runtime-${{ matrix.group }}
      - uses: actions/setup-node@v4
        if: matrix.node_version
        with:
          node-version: ${{ matrix.node_version }}
      # Preview 3 runs on the stock crates.io wasmtime: the Golem wasmtime fork is Preview 2 only,
      # and the P3 host support in tests/common/mod.rs is gated to non-fork builds. So this lane
      # deliberately does NOT run enable-wasmtime-fork.sh or pass --features use-golem-wasmtime.
      - name: Runtime tests on WASI Preview 3 (group ${{ matrix.group }}/9)
        run: cargo test --test runtime -- ${{ matrix.test_args }} --report-time --format ctrf --logfile target/ctrf.json ':tag:group${{ matrix.group }}'
        env:
          NODE_MODULES_APP_STRICT_NODE_BASELINE: "1"
      - name: Collect Test Report
        uses: ./.github/actions/collect-test-report
        if: always()
        with:
          name: test-runtime-p3-group-${{ matrix.group }}

  # The full node_compat suite, run against the WASI Preview 3 generation path. Runs *every*
  # node_compat test the Preview 2 lane runs (same shard tags, same config.jsonc allow-list of
  # runnable Node.js tests) — there is no additional P3 filter. Expected to have failures until the
  # remaining P3 gaps are closed; it therefore does not gate releases.
  test-node-compat-p3:
    needs: [quick-checks]
    runs-on: blacksmith-16vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      WASM_RQUICKJS_TEST_TARGET: p3
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: p3
          component-cache-key: p3-node-${{ matrix.shard }}
      # Stock crates.io wasmtime — see the note in `test-runtime-p3`.
      - name: Vendor Node.js test suite
        run: bash tests/node_compat/vendor.sh
      - name: Node compat tests on WASI Preview 3 (shard ${{ matrix.shard }}/8)
        run: cargo test --test node_compat -- --report-time --format ctrf --logfile target/ctrf.json ':tag:shard${{ matrix.shard }}'
      - name: Collect Test Report
        uses: ./.github/actions/collect-test-report
        if: always()
        with:
          name: test-node-compat-p3-shard-${{ matrix.shard }}

  test-reports:
    if: ${{ always() && !cancelled() }}
    needs: [test-other, test-runtime, test-node-compat, test-runtime-p3, test-node-compat-p3]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Select latest evidence per lane before downloading
        id: reports
        uses: actions/github-script@v7
        with:
          script: |
            const { selectArtifacts } = require('./.github/scripts/prepare-test-reports.cjs');
            await selectArtifacts({ github, context, core });
      - uses: actions/download-artifact@v4
        if: steps.reports.outputs.ids != ''
        with:
          # Partial and report-only reruns reuse the latest evidence per lane.
          artifact-ids: ${{ steps.reports.outputs.ids }}
          github-token: ${{ github.token }}
          path: test-reports
          merge-multiple: false
      - name: Preserve source name when downloading a single artifact
        if: steps.reports.outputs.single-name != ''
        env:
          ARTIFACT_NAME: ${{ steps.reports.outputs.single-name }}
        run: |
          if compgen -G 'test-reports/ctrf-*.json' > /dev/null; then
            mv test-reports single-test-report
            mkdir test-reports
            mv single-test-report "test-reports/${ARTIFACT_NAME}"
          fi
      - name: Preserve consolidated evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-reports-attempt${{ github.run_attempt }}
          path: test-reports
          retention-days: 35
          if-no-files-found: warn
      # Evidence collection is strict; optional GitHub presentation is not a
      # release gate. Re-running this job never needs to re-run the tests.
      - name: Prepare lane-qualified presentation
        if: hashFiles('test-reports/**/ctrf-*.json') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { prepareReports } = require('./.github/scripts/prepare-test-reports.cjs');
            await prepareReports('test-reports', 'rendered-reports', message => core.warning(message));
      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        continue-on-error: true
        with:
          report-path: 'rendered-reports/*/ctrf-*.json'
          summary: true
          summary-report: true
          failed-report: true
          # Historical crawling belongs outside the per-commit critical path.
          slowest-report: false
          github-report: true
          flaky-report: true
          collapse-large-reports: true
          exit-on-no-files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-binaries:
    needs: [build, test-other, test-runtime, test-node-compat, test-p3]
    if: "startsWith(github.ref, 'refs/tags/v')"
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-16vcpu-ubuntu-2404
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: blacksmith-16vcpu-ubuntu-2404
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: useblacksmith/rust-cache@v3
        with:
          prefix-key: v1-rust
          shared-key: release-${{ matrix.target }}
          cache-all-crates: true
      - id: get_version
        uses: battila7/get-version-action@v2
      - name: Set version
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.version-without-v }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/0.0.0/$VERSION/g" Cargo.toml
          else
            sed -i "s/0.0.0/$VERSION/g" Cargo.toml
          fi
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE="wasm-rquickjs-cli-v${{ steps.get_version.outputs.version-without-v }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C target/${{ matrix.target }}/release wasm-rquickjs
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          ARCHIVE="wasm-rquickjs-cli-v${{ steps.get_version.outputs.version-without-v }}-${{ matrix.target }}.zip"
          cd target/${{ matrix.target }}/release
          7z a "../../../$ARCHIVE" wasm-rquickjs.exe
          cd ../../..
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}

  publish:
    needs: [build, test-other, test-runtime, test-node-compat, test-p3]
    if: "startsWith(github.ref, 'refs/tags/v')"
    runs-on: blacksmith-16vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - id: get_version
        uses: battila7/get-version-action@v2
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          export VERSION="${{ steps.get_version.outputs.version-without-v }}"
          sed -i "s/0.0.0/$VERSION/g" Cargo.toml
          cargo publish -p wasm-rquickjs --features optimize --allow-dirty
          cargo publish -p wasm-rquickjs-cli --allow-dirty
