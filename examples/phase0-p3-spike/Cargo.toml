[package]
name = "phase0-p3-spike"
version = "0.0.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
rquickjs = { version = "0.10.0", default-features = false, features = ["std", "futures", "bindgen", "macro"] }
wasip3 = "=0.6.0"
wit-bindgen = { version = "0.58.0", default-features = false, features = ["async", "macros", "inter-task-wakeup"] }
