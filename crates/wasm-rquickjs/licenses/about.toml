# The allow-list is intentionally limited to licenses reviewed for generated component
# dependencies. New or changed expressions fail the audit until this policy receives explicit
# maintainer/legal review; cargo-about output is not legal advice.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
targets = ["wasm32-wasip2"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }

# These packages either omit their repository license from the published crate or are
# misidentified by generic SPDX fallback text. Resolve their exact upstream texts at the
# crates.io-published VCS revisions (or from the packaged file) and pin every input by SHA-256.
[base64-simd.clarify]
license = "MIT"

